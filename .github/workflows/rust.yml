# 工作流名称
name: Rust

# 触发条件配置
on:
  push: # 代码推送时触发
    branches: ["main"] # 仅监控main分支
  pull_request: # 创建Pull Request时触发
    branches: ["main"] # 仅监控针对main分支的PR

# 全局环境变量
env:
  CARGO_TERM_COLOR: always # 强制Cargo输出带颜色

# 定义的工作任务
jobs:
  # 代码格式化
  fmt:
    runs-on: windows-latest # 使用Windows运行环境

    steps:
      - uses: actions/checkout@v4 # 检出仓库代码
      - name: Format
        run: cargo fmt # 代码格式化

  # Rust代码静态分析检查
  clippy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        # 运行Clippy检查并拒绝所有警告(警告会导致任务失败)
        run: cargo clippy -- -D warnings

  # 安全审计任务
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit

  # 构建和测试任务
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose # 详细模式构建项目
      - name: Run tests
        run: cargo test --verbose # 详细模式运行所有测试

  # 文档生成和部署
  docs:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build docs
        run: cargo doc --no-deps
      - name: Create redirect index  # 重定向到文档目录
        run: |
          echo '<!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=./zero2prod/index.html" />
          </head>
          <body>
            <p>Redirecting to <a href="./zero2prod/index.html">documentation</a>...</p>
          </body>
          </html>' > ./target/doc/index.html

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc/
          publish_branch: gh-pages
